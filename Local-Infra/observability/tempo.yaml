stream_over_http_enabled: true
multitenancy_enabled: false
server:
  http_listen_port: 3200
  log_level: info
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
# Tempo 3.1 uses backend_worker.compaction, NOT the old top-level compactor.
# Disposable synthetic retention; NOT production retention/SLA policy.
backend_worker:
  compaction:
    block_retention: 24h
