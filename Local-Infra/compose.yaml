# V3-LOCAL-INFRA-001: synthetic development dependencies, NOT product deployment.
name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}

x-dev-defaults: &dev-defaults
  restart: "no"
  init: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  postgres:
    <<: *dev-defaults
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128mb
    environment:
      POSTGRES_USER: neshane_dev_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set development bootstrap password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a distinct development app password}
      POSTGRES_DB: neshane_dev
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    networks: [postgres]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-development-role.sh:/docker-entrypoint-initdb.d/10-development-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -X --host=127.0.0.1 --username=neshane_dev_app --dbname=neshane_dev --no-password --quiet --tuples-only --command="SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  redis:
    <<: *dev-defaults
    image: redis:7.4.12@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    mem_limit: 384m
    cpus: 0.5
    networks: [redis]
    # No host port, no other service joins this network. No real/session data.
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    <<: *dev-defaults
    image: rabbitmq:4.2.9-management@sha256:7fa20d0d23d63ed90499bbf62e24af48ec4ae5eb22d173f3db96e3f85b26884a
    # Stable node identity for its own volume; NOT a global container_name.
    hostname: rabbitmq
    mem_limit: 768m
    cpus: 1.0
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set development management user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set development management password}
      RABBITMQ_DEFAULT_VHOST: neshane_dev
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-25672}:15672"
    networks: [broker]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [CMD-SHELL, "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 45s

  mailpit:
    <<: *dev-defaults
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_MAX_AGE: 24h
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    networks: [mail]
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    <<: *dev-defaults
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-14318}:4318"
    networks: [telemetry]
    depends_on:
      tempo:
        condition: service_started
    # Image has no shell/HTTP probe. health_check extension is internal :13133;
    # no fake Docker health check and no healthy dependency claim.

  prometheus:
    <<: *dev-defaults
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    mem_limit: 512m
    cpus: 0.5
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    networks: [telemetry]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    <<: *dev-defaults
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    mem_limit: 384m
    cpus: 0.5
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set development Grafana admin user}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set development Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    networks: [telemetry]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    <<: *dev-defaults
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    mem_limit: 768m
    cpus: 1.0
    cap_drop: [ALL]
    command: [-target=all, -config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [telemetry]
    # HTTP API /ready is internal :3200; no host API or OTLP publication.

# Segmentation is the isolation boundary (one network per service group). Host
# ingress requires a gateway, so `internal: true` is used ONLY for the unpublished
# Redis network; it is intentionally absent where a host port must be published
# (Docker Desktop suppresses port publication on internal networks). Container
# egress isolation is therefore not provided for published services.
networks:
  postgres:
  redis:
    internal: true
  broker:
  mail:
  telemetry:

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mailpit_data:
  prometheus_data:
  grafana_data:
  tempo_data:
